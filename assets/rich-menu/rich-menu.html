<!doctype html>
<!-- ต้นฉบับ Rich Menu ของ X Fitness — แก้ที่นี่แล้วรัน render.py เพื่อได้ rich-menu.png (2500×1686)
     ภาษาภาพเดียวกับ x-fitness/frontend: มุมเหลี่ยม · เส้นกริดบาง · มุมตัด (--cut) · แถบแดงเอียง · eyebrow ตัว mono -->
<html lang="th">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+Thai:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090a;--bg-2:#101012;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.18);
  --text:#f5f5f4;--muted:#a3a3a8;--red:#e10613;--red-hot:#ff2536;--red-deep:#8e0a12;
  --body:"IBM Plex Sans Thai",sans-serif;--mono:"IBM Plex Mono",monospace;--cut:56px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2500px;height:1686px;background:var(--bg);overflow:hidden;color:var(--text)}
/* เส้นกริดบางระหว่างช่อง แบบ .plans / .slots ของเว็บ */
.grid{display:grid;grid-template-columns:833px 833px 834px;grid-template-rows:841px 841px;gap:4px;background:var(--line-2);width:100%;height:100%}
.tile{position:relative;overflow:hidden;background:var(--bg);padding:72px 76px 84px;display:flex;flex-direction:column}
/* พื้นกริดจาง ๆ แบบ hero */
.tile::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 2px,transparent 2px),linear-gradient(90deg,var(--line) 2px,transparent 2px);background-size:120px 120px;-webkit-mask-image:linear-gradient(160deg,#000,transparent 70%)}
.tile>*{position:relative}
.eyebrow{display:flex;align-items:center;gap:22px;font:600 40px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--red-hot)}
.eyebrow span{color:var(--muted)}
.eyebrow::before{content:"";width:56px;height:5px;background:currentColor}
/* กล่องไอคอนมุมตัด แบบ .btn / .mono-mark */
.ico{position:relative;width:200px;height:200px;display:grid;place-items:center;background:var(--line-2);
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.ico::before{content:"";position:absolute;inset:4px;background:var(--bg-2);
  clip-path:polygon(0 0,calc(100% - var(--cut) + 2px) 0,100% calc(var(--cut) - 2px),100% 100%,calc(var(--cut) - 2px) 100%,0 calc(100% - var(--cut) + 2px))}
.ico svg{position:relative;width:120px;height:120px;stroke:var(--red);stroke-width:2;fill:none;stroke-linecap:square;stroke-linejoin:miter}
.th{margin-top:52px;font:700 102px/1.1 var(--body);letter-spacing:-.01em;white-space:nowrap}
/* ลูกศรสามเหลี่ยมมุมขวาล่าง บอกว่ากดได้ (แบบ bullet ใน .plan li) */
.row{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.go{width:44px;height:44px;background:var(--red);clip-path:polygon(0 0,100% 50%,0 100%)}

/* ปุ่มหลัก: แดงไล่เข้ม + แถบเอียงแบบ .slashes ใน hero */
.hot{background:linear-gradient(160deg,var(--red-hot),var(--red) 45%,var(--red-deep))}
.hot::before{display:none}
.slash{position:absolute;top:-10%;bottom:-10%;transform:skewX(-20deg);background:rgba(0,0,0,.18)}
.slash.a{right:-80px;width:230px}
.slash.b{right:200px;width:60px;background:rgba(255,255,255,.12)}
.hot .eyebrow,.hot .eyebrow span{color:#fff}
.hot .ico{background:rgba(255,255,255,.55)}
.hot .ico::before{background:var(--red-deep)}
.hot .ico svg{stroke:#fff}
.hot .go{background:#fff}
.tag{position:absolute;top:0;right:0;background:var(--bg);color:#fff;font:600 36px/1 var(--mono);letter-spacing:.16em;padding:22px 30px}
</style>
</head>
<body>
<div class="grid">
  <div class="tile"><div class="eyebrow">01 <span>Membership</span></div>
    <div class="row"><div class="ico"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="6" y1="15" x2="10" y2="15"/></svg></div><i class="go"></i></div>
    <div class="th">แพ็กเกจ &amp; ราคา</div></div>

  <div class="tile"><div class="eyebrow">02 <span>Classes</span></div>
    <div class="row"><div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M7.5 14h1M11.5 14h1M15.5 14h1M7.5 17.5h1M11.5 17.5h1"/></svg></div><i class="go"></i></div>
    <div class="th">ตารางคลาส</div></div>

  <div class="tile hot"><i class="slash a"></i><i class="slash b"></i><span class="tag">HOT</span>
    <div class="eyebrow">03 <span>Promotions</span></div>
    <div class="row"><div class="ico"><svg viewBox="0 0 24 24"><path d="M21 13l-8 8-11-11V2h8z"/><rect x="5.5" y="5.5" width="2" height="2"/></svg></div><i class="go"></i></div>
    <div class="th">โปรโมชัน</div></div>

  <div class="tile"><div class="eyebrow">04 <span>Payment</span></div>
    <div class="row"><div class="ico"><svg viewBox="0 0 24 24"><path d="M5 2h14v20l-2.3-1.5L14.3 22 12 20.5 9.7 22l-2.4-1.5L5 22z"/><line x1="8.5" y1="7" x2="15.5" y2="7"/><line x1="8.5" y1="10.5" x2="15.5" y2="10.5"/><path d="M9 15l2 2 4-4"/></svg></div><i class="go"></i></div>
    <div class="th">ส่งสลิปชำระเงิน</div></div>

  <div class="tile"><div class="eyebrow">05 <span>My Account</span></div>
    <div class="row"><div class="ico"><svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="8"/><path d="M4 21v-3l3-3h10l3 3v3"/></svg></div><i class="go"></i></div>
    <div class="th">ข้อมูลสมาชิก</div></div>

  <div class="tile"><div class="eyebrow">06 <span>Contact Staff</span></div>
    <div class="row"><div class="ico"><svg viewBox="0 0 24 24"><path d="M3 4h18v13H10l-5 4v-4H3z"/><path d="M7.5 10.5h1M11.5 10.5h1M15.5 10.5h1"/></svg></div><i class="go"></i></div>
    <div class="th">คุยกับพนักงาน</div></div>
</div>
</body>
</html>
