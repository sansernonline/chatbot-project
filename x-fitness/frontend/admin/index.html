<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Fitness Admin</title>
<link rel="icon" href="data:,">
<meta name="description" content="ระบบหลังบ้าน X Fitness — กล่องแชตตอบลูกค้า สมาชิก การชำระเงิน และแชตบอท">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<section class="login" id="login">
  <form class="login-box" id="loginForm" autocomplete="off">
    <div class="brand"><span class="logo">X</span><div><b>X FITNESS</b><small>ระบบหลังบ้าน</small></div></div>
    <label>ชื่อผู้ใช้<input id="lUser" required autofocus></label>
    <label>รหัสผ่าน<input id="lPass" type="password" required></label>
    <p class="login-err" id="loginErr" role="alert"></p>
    <button class="btn red" type="submit">เข้าสู่ระบบ</button>
    <p class="hint">บัญชีทดสอบ admin / 1234</p>
  </form>
</section>

<!-- ============ APP SHELL ============ -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><span class="logo">X</span><div><b>X FITNESS</b><small>Admin Console</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot"><small id="storeMode"></small><a href="../index.html" target="_blank" data-icon="ext">เปิดหน้าเว็บลูกค้า</a></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon menu-btn" id="menuBtn" aria-label="เปิดเมนู" data-icon="menu"></button>
      <h1 id="pageTitle"></h1>
      <div class="top-right"><span class="who">แอดมิน · ผู้จัดการสาขา</span><button class="btn ghost sm" id="logout" data-icon="out">ออกจากระบบ</button></div>
    </header>
    <main id="view"></main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="../shared/db.js"></script>
<script src="../shared/chat-store.js"></script>
<script src="admin.js"></script>
<script src="pages.js"></script>
<script src="inbox.js"></script>
</body>
</html>
